<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IDE - Algoritmos Fundamentais</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Prism.js (Syntax Highlighting) - Dark Theme -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
    
    <style>
        /* Customizações de scrollbar e layout para manter aspecto de IDE */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1e1e2f; 
        }
        ::-webkit-scrollbar-thumb {
            background: #475569; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #64748b; 
        }
        
        pre[class*="language-"] {
            margin: 0 !important;
            height: 100%;
            border-radius: 0;
            background-color: transparent !important;
        }

        #code-editor-container {
            background-color: #1d1f21; /* Cor do Prism Tomorrow */
        }

        .terminal-cursor {
            display: inline-block;
            width: 8px;
            height: 15px;
            background-color: #4ade80;
            animation: blink 1s step-end infinite;
            vertical-align: middle;
            margin-left: 2px;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 font-sans h-screen flex overflow-hidden selection:bg-blue-500 selection:text-white">

    <!-- Sidebar (Lista de Algoritmos) -->
    <aside class="w-64 bg-gray-800 border-r border-gray-700 flex flex-col h-full flex-shrink-0 z-20 hidden md:flex absolute md:relative">
        <div class="p-4 border-b border-gray-700 flex items-center gap-2 bg-gray-900">
            <svg class="w-6 h-6 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"></path></svg>
            <h1 class="text-lg font-bold text-gray-100 tracking-wide">Algoritmos</h1>
        </div>
        <div class="p-2 text-xs font-semibold text-gray-500 uppercase tracking-wider mt-2">Explorador</div>
        <nav class="flex-1 overflow-y-auto p-2 flex flex-col gap-1" id="sidebar-nav">
            <!-- Os botões dos algoritmos serão injetados aqui -->
        </nav>
    </aside>

    <!-- Overlay Mobile -->
    <div id="mobile-overlay" class="fixed inset-0 bg-black/50 z-10 hidden md:hidden"></div>

    <!-- Main Content Area -->
    <main class="flex-1 flex flex-col h-full w-full overflow-hidden bg-gray-950">
        
        <!-- Navbar Superior (Mobile Toggle + Título) -->
        <header class="h-12 bg-gray-800 border-b border-gray-700 flex items-center px-4 flex-shrink-0">
            <button id="btn-toggle-sidebar" class="md:hidden mr-3 text-gray-400 hover:text-white">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
            </button>
            <div class="flex items-center text-sm">
                <span class="text-gray-400 mr-2">/algoritmos/</span>
                <span id="header-algo-name" class="font-mono text-blue-300 font-semibold">selecione.java</span>
            </div>
        </header>

        <!-- Divisão Horizontal: Topo (Código) / Base (Execução) -->
        <div class="flex-1 flex flex-col lg:flex-row overflow-hidden">
            
            <!-- Área do Código -->
            <div class="flex-1 flex flex-col overflow-hidden border-b lg:border-b-0 lg:border-r border-gray-700 relative">
                <div class="h-8 bg-gray-800 flex items-center px-4 text-xs font-mono text-gray-400 border-b border-gray-700 select-none">
                    <span id="tab-filename">Código Fonte</span>
                </div>
                <div id="code-editor-container" class="flex-1 overflow-auto p-4 text-sm relative">
                    <pre><code id="code-display" class="language-java">// Selecione um algoritmo na barra lateral...</code></pre>
                </div>
            </div>

            <!-- Painel de Execução (Direita no Desktop, Baixo no Mobile) -->
            <div class="w-full lg:w-[400px] xl:w-[450px] flex flex-col bg-gray-900 flex-shrink-0 h-1/2 lg:h-full">
                <!-- Configurações e Inputs -->
                <div class="p-4 overflow-y-auto border-b border-gray-700 flex-1">
                    <h2 class="text-sm font-bold text-gray-200 uppercase tracking-wider mb-1">Painel de Controle</h2>
                    <p id="panel-desc" class="text-xs text-gray-400 mb-4 h-8">Descrição do algoritmo aparecerá aqui.</p>

                    <!-- Seletor de Linguagem -->
                    <div class="mb-4">
                        <label class="block text-xs font-medium text-gray-400 mb-1">Linguagem de Execução</label>
                        <select id="lang-select" class="w-full bg-gray-800 border border-gray-700 text-sm rounded-md py-2 px-3 text-white focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all">
                            <option value="java">Java (via JVM Simulada)</option>
                            <option value="js">JavaScript (Nativo)</option>
                        </select>
                    </div>

                    <!-- Container de Inputs Dinâmicos -->
                    <div id="dynamic-inputs" class="flex flex-col gap-3 mb-4">
                        <!-- Inputs são gerados via JS -->
                    </div>

                    <button id="btn-execute" class="w-full bg-blue-600 hover:bg-blue-500 text-white text-sm font-semibold py-2.5 px-4 rounded-md transition-colors flex justify-center items-center gap-2 shadow-lg disabled:opacity-50 disabled:cursor-not-allowed">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        Executar Algoritmo
                    </button>
                </div>

                <!-- Terminal -->
                <div class="h-48 lg:h-1/3 bg-black flex flex-col">
                    <div class="bg-gray-800 px-3 py-1 flex items-center gap-2 border-b border-gray-700">
                        <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 9l3 3-3 3m5 0h3M4 12a8 8 0 1116 0 8 8 0 01-16 0z"></path></svg>
                        <span class="text-xs font-mono text-gray-400">Terminal de Saída</span>
                    </div>
                    <div id="terminal-output" class="flex-1 p-3 font-mono text-xs overflow-y-auto text-gray-300">
                        <div>Servidor de testes iniciado. Aguardando execução...</div>
                        <!-- Saídas vão aqui -->
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Prism.js Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-java.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js"></script>

    <script>
        // Definição dos algoritmos com códigos e lógica de execução
        const algorithms = {
            primo: {
                id: 'primo',
                title: 'Número Primo',
                desc: 'Verifica se o número informado é primo (divisível apenas por 1 e ele mesmo).',
                inputs: [
                    { id: 'n', label: 'Digite um número inteiro:', placeholder: 'Ex: 29' }
                ],
                java: `public class Main {
    public static boolean isPrimo(int n) {
        if (n <= 1) return false;
        for (int i = 2; i <= Math.sqrt(n); i++) {
            if (n % i == 0) return false;
        }
        return true;
    }
    
    public static void main(String[] args) {
        int numero = 29;
        System.out.println("É primo? " + isPrimo(numero));
    }
}`,
                js: `function isPrimo(n) {
    if (n <= 1) return false;
    for (let i = 2; i <= Math.sqrt(n); i++) {
        if (n % i === 0) return false;
    }
    return true;
}

const numero = 29;
console.log("É primo?", isPrimo(numero));`,
                run: (vals) => {
                    const n = parseInt(vals.n);
                    if (isNaN(n)) throw new Error("Entrada inválida. Digite um número.");
                    if (n <= 1) return `${n} NÃO é primo.`;
                    for (let i = 2; i <= Math.sqrt(n); i++) {
                        if (n % i === 0) return `${n} NÃO é primo (divisível por ${i}).`;
                    }
                    return `${n} É um número primo!`;
                }
            },
            fibonacci: {
                id: 'fibonacci',
                title: 'Fibonacci',
                desc: 'Gera a sequência de Fibonacci até a quantidade de termos solicitada.',
                inputs: [
                    { id: 'termos', label: 'Quantidade de termos:', placeholder: 'Ex: 10' }
                ],
                java: `public class Main {
    public static void printFibonacci(int termos) {
        if (termos <= 0) return;
        int a = 0, b = 1;
        System.out.print(a);
        for (int i = 1; i < termos; i++) {
            System.out.print(", " + b);
            int proximo = a + b;
            a = b;
            b = proximo;
        }
        System.out.println();
    }
}`,
                js: `function getFibonacci(termos) {
    if (termos <= 0) return [];
    if (termos === 1) return [0];
    let seq = [0, 1];
    for (let i = 2; i < termos; i++) {
        seq.push(seq[i-1] + seq[i-2]);
    }
    return seq;
}`,
                run: (vals) => {
                    const n = parseInt(vals.termos);
                    if (isNaN(n) || n <= 0) throw new Error("Insira um número maior que 0.");
                    if (n > 5000) throw new Error("Muitos termos solicitados. Limite: 5000.");
                    if (n === 1) return "0";
                    let seq = [0, 1];
                    for (let i = 2; i < n; i++) {
                        seq.push(seq[i-1] + seq[i-2]);
                    }
                    return seq.join(", ");
                }
            },
            somatorio: {
                id: 'somatorio',
                title: 'Somatório',
                desc: 'Calcula a soma total de uma lista de números.',
                inputs: [
                    { id: 'lista', label: 'Números separados por vírgula:', placeholder: 'Ex: 10.5, 20, 5' }
                ],
                java: `public class Main {
    public static double calcularSomatorio(double[] numeros) {
        double soma = 0;
        for (double num : numeros) {
            soma += num;
        }
        return soma;
    }
}`,
                js: `function calcularSomatorio(numeros) {
    let soma = 0;
    for (let i = 0; i < numeros.length; i++) {
        soma += numeros[i];
    }
    return soma;
}`,
                run: (vals) => {
                    if (!vals.lista.trim()) throw new Error("Lista vazia.");
                    const numeros = vals.lista.split(',').map(n => parseFloat(n.trim()));
                    if (numeros.some(isNaN)) throw new Error("A lista deve conter apenas números.");
                    const soma = numeros.reduce((acc, curr) => acc + curr, 0);
                    return `Soma Total: ${soma}`;
                }
            },
            mdc: {
                id: 'mdc',
                title: 'MDC (Máx. Divisor Comum)',
                desc: 'Encontra o maior divisor comum entre dois números inteiros (Algoritmo de Euclides).',
                inputs: [
                    { id: 'num1', label: 'Primeiro Valor (A):', placeholder: 'Ex: 48' },
                    { id: 'num2', label: 'Segundo Valor (B):', placeholder: 'Ex: 18' }
                ],
                java: `public class Main {
    public static int calcularMDC(int a, int b) {
        while (b != 0) {
            int temp = b;
            b = a % b;
            a = temp;
        }
        return a;
    }
}`,
                js: `function calcularMDC(a, b) {
    while (b !== 0) {
        let temp = b;
        b = a % b;
        a = temp;
    }
    return a;
}`,
                run: (vals) => {
                    let a = parseInt(vals.num1);
                    let b = parseInt(vals.num2);
                    if (isNaN(a) || isNaN(b)) throw new Error("Forneça dois números válidos.");
                    
                    const origA = a, origB = b;
                    while (b !== 0) {
                        let temp = b;
                        b = a % b;
                        a = temp;
                    }
                    return `MDC(${origA}, ${origB}) = ${Math.abs(a)}`;
                }
            },
            contagem: {
                id: 'contagem',
                title: 'Contagem de Inteiros',
                desc: 'Verifica uma lista e conta quantos elementos são números inteiros válidos.',
                inputs: [
                    { id: 'lista', label: 'Valores separados por vírgula:', placeholder: 'Ex: 1, text, 4.5, 9' }
                ],
                java: `public class Main {
    public static int contarInteiros(String[] valores) {
        int contagem = 0;
        for (String v : valores) {
            try {
                Integer.parseInt(v.trim());
                contagem++;
            } catch (NumberFormatException e) {
                // Não é um inteiro válido
            }
        }
        return contagem;
    }
}`,
                js: `function contarInteiros(valores) {
    let contagem = 0;
    for (let val of valores) {
        val = val.trim();
        let num = Number(val);
        if (val !== '' && !isNaN(num) && Number.isInteger(num)) {
            contagem++;
        }
    }
    return contagem;
}`,
                run: (vals) => {
                    if (!vals.lista.trim()) throw new Error("Lista vazia.");
                    const valores = vals.lista.split(',');
                    let contagem = 0;
                    for (let val of valores) {
                        val = val.trim();
                        let num = Number(val);
                        if (val !== '' && !isNaN(num) && Number.isInteger(num)) {
                            contagem++;
                        }
                    }
                    return `Encontrados ${contagem} número(s) inteiro(s).`;
                }
            },
            ordenamento: {
                id: 'ordenamento',
                title: 'Ordenamento (Bubble Sort)',
                desc: 'Ordena um conjunto numérico em ordem crescente utilizando o método da bolha.',
                inputs: [
                    { id: 'lista', label: 'Lista de números desordenada:', placeholder: 'Ex: 5, 1, 4, 2, 8' }
                ],
                java: `public class Main {
    public static void bubbleSort(int[] arr) {
        int n = arr.length;
        for (int i = 0; i < n - 1; i++) {
            for (int j = 0; j < n - i - 1; j++) {
                if (arr[j] > arr[j + 1]) {
                    // Swap
                    int temp = arr[j];
                    arr[j] = arr[j + 1];
                    arr[j + 1] = temp;
                }
            }
        }
    }
}`,
                js: `function bubbleSort(arr) {
    let n = arr.length;
    for (let i = 0; i < n - 1; i++) {
        for (let j = 0; j < n - i - 1; j++) {
            if (arr[j] > arr[j + 1]) {
                // Swap
                let temp = arr[j];
                arr[j] = arr[j + 1];
                arr[j + 1] = temp;
            }
        }
    }
    return arr;
}`,
                run: (vals) => {
                    if (!vals.lista.trim()) throw new Error("Lista vazia.");
                    const arr = vals.lista.split(',').map(n => parseFloat(n.trim()));
                    if (arr.some(isNaN)) throw new Error("A lista deve conter apenas números.");
                    
                    let n = arr.length;
                    for (let i = 0; i < n - 1; i++) {
                        for (let j = 0; j < n - i - 1; j++) {
                            if (arr[j] > arr[j + 1]) {
                                let temp = arr[j];
                                arr[j] = arr[j + 1];
                                arr[j + 1] = temp;
                            }
                        }
                    }
                    return `[ ${arr.join(', ')} ]`;
                }
            }
        };

        
        let currentAlgo = null;

        // Elementos DOM
        const sidebarNav = document.getElementById('sidebar-nav');
        const headerAlgoName = document.getElementById('header-algo-name');
        const tabFilename = document.getElementById('tab-filename');
        const codeDisplay = document.getElementById('code-display');
        const langSelect = document.getElementById('lang-select');
        const dynamicInputs = document.getElementById('dynamic-inputs');
        const panelDesc = document.getElementById('panel-desc');
        const btnExecute = document.getElementById('btn-execute');
        const terminalOutput = document.getElementById('terminal-output');
        
        // Elementos Mobile
        const sidebar = document.querySelector('aside');
        const mobileOverlay = document.getElementById('mobile-overlay');
        const btnToggleSidebar = document.getElementById('btn-toggle-sidebar');

        // Inicializar Menu Lateral
        function initNav() {
            Object.values(algorithms).forEach(algo => {
                const btn = document.createElement('button');
                btn.className = 'w-full text-left px-3 py-2 text-sm rounded-md text-gray-300 hover:bg-gray-700 hover:text-white transition-colors nav-btn flex items-center gap-2';
                btn.dataset.id = algo.id;
                
                // Ícone genérico de arquivo
                btn.innerHTML = `
                    <svg class="w-4 h-4 text-gray-500" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M4 4a2 2 0 012-2h4.586A2 2 0 0112 2.586L15.414 6A2 2 0 0116 7.414V16a2 2 0 01-2 2H6a2 2 0 01-2-2V4z" clip-rule="evenodd"></path></svg>
                    <span class="truncate">${algo.title}</span>
                `;
                
                btn.addEventListener('click', () => {
                    loadAlgorithm(algo.id);
                    if (window.innerWidth < 768) toggleSidebar();
                });
                sidebarNav.appendChild(btn);
            });
        }

        // Carregar Algoritmo
        function loadAlgorithm(id) {
            currentAlgo = algorithms[id];
            const lang = langSelect.value;
            
            // Destacar botão ativo
            document.querySelectorAll('.nav-btn').forEach(btn => {
                if (btn.dataset.id === id) {
                    btn.classList.add('bg-blue-600/20', 'text-blue-400', 'font-medium');
                    btn.classList.remove('text-gray-300', 'hover:bg-gray-700');
                    btn.querySelector('svg').classList.replace('text-gray-500', 'text-blue-400');
                } else {
                    btn.classList.remove('bg-blue-600/20', 'text-blue-400', 'font-medium');
                    btn.classList.add('text-gray-300', 'hover:bg-gray-700');
                    btn.querySelector('svg').classList.replace('text-blue-400', 'text-gray-500');
                }
            });

            // Atualizar Textos
            headerAlgoName.textContent = `${id}.${lang === 'java' ? 'java' : 'js'}`;
            tabFilename.textContent = `Algoritmo_${currentAlgo.id.toUpperCase()}.${lang === 'java' ? 'java' : 'js'}`;
            panelDesc.textContent = currentAlgo.desc;
            
            // Atualizar Código
            updateCodeView();

            // Gerar Inputs Dinâmicos
            dynamicInputs.innerHTML = '';
            currentAlgo.inputs.forEach(inputDef => {
                const wrapper = document.createElement('div');
                wrapper.innerHTML = `
                    <label class="block text-xs font-medium text-gray-400 mb-1" for="input-${inputDef.id}">${inputDef.label}</label>
                    <input type="text" id="input-${inputDef.id}" data-key="${inputDef.id}" placeholder="${inputDef.placeholder}" 
                           class="algo-input w-full bg-gray-800 border border-gray-700 rounded-md py-2 px-3 text-sm text-white focus:outline-none focus:border-blue-500 transition-colors" autocomplete="off">
                `;
                dynamicInputs.appendChild(wrapper);
                
                // Executar ao dar Enter
                wrapper.querySelector('input').addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') btnExecute.click();
                });
            });

            btnExecute.disabled = false;
            
            // Auto focus no primeiro input
            setTimeout(() => {
                const firstInput = document.querySelector('.algo-input');
                if(firstInput) firstInput.focus();
            }, 100);
        }

        // Atualizar Visualização de Código baseado no Dropdown
        function updateCodeView() {
            if (!currentAlgo) return;
            const lang = langSelect.value;
            
            // Atualiza extensões nos títulos
            headerAlgoName.textContent = `${currentAlgo.id}.${lang === 'java' ? 'java' : 'js'}`;
            tabFilename.textContent = `Algoritmo_${currentAlgo.id.toUpperCase()}.${lang === 'java' ? 'java' : 'js'}`;

            // Define código e classe do Prism
            codeDisplay.textContent = currentAlgo[lang];
            codeDisplay.className = `language-${lang === 'java' ? 'java' : 'javascript'}`;
            
            // Re-aplicar Highlighting
            Prism.highlightElement(codeDisplay);
        }

        
        // Função para escrever no terminal
        function logToTerminal(message, type = 'info') {
            const div = document.createElement('div');
            div.className = 'mb-1 leading-relaxed';
            
            const time = new Date().toLocaleTimeString('pt-BR', { hour12: false });
            let colorClass = 'text-gray-300';
            
            if (type === 'success') colorClass = 'text-green-400';
            else if (type === 'error') colorClass = 'text-red-400';
            else if (type === 'system-java') colorClass = 'text-yellow-400 font-semibold';
            else if (type === 'system-js') colorClass = 'text-blue-400 font-semibold';
            
            div.innerHTML = `<span class="text-gray-600 mr-2">[${time}]</span><span class="${colorClass}">${message}</span>`;
            terminalOutput.appendChild(div);
            terminalOutput.scrollTop = terminalOutput.scrollHeight;
        }

        // Evento de Mudança de Linguagem
        langSelect.addEventListener('change', updateCodeView);

        // Botão de Executar
        btnExecute.addEventListener('click', () => {
            if (!currentAlgo) return;
            
            const lang = langSelect.value;
            const inputs = document.querySelectorAll('.algo-input');
            const inputValues = {};
            let hasEmpty = false;
            
            inputs.forEach(input => {
                inputValues[input.dataset.key] = input.value;
                if (!input.value.trim()) hasEmpty = true;
            });

            // O TRUQUE DA APRESENTAÇÃO ACONTECE AQUI:
            // Exibimos a mensagem fingindo que estamos compilando Java, 
            // mas o JS executa a lógica por trás.
            if (lang === 'java') {
                logToTerminal(`[Compilando e Simulando execução na JVM...] -> Arquivo: ${currentAlgo.id}.java`, 'system-java');
            } else {
                logToTerminal(`[Executando nativamente no Navegador...] -> Engine: V8 / JS`, 'system-js');
            }

            // Desabilita botão rapidamente para efeito visual
            btnExecute.disabled = true;
            btnExecute.innerHTML = `<svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> Processando...`;

            // Simulando um delay de execução (efeito de apresentação)
            setTimeout(() => {
                try {
                    const resultado = currentAlgo.run(inputValues);
                    logToTerminal(`> ${resultado}`, 'success');
                } catch (error) {
                    logToTerminal(`> Erro de Execução: ${error.message}`, 'error');
                } finally {
                    btnExecute.disabled = false;
                    btnExecute.innerHTML = `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg> Executar Algoritmo`;
                    
                    // Adiciona o cursor piscando ao final
                    const cursorDiv = document.createElement('div');
                    cursorDiv.innerHTML = `<span class="text-green-500 font-bold">>_</span>`;
                    terminalOutput.appendChild(cursorDiv);
                    terminalOutput.scrollTop = terminalOutput.scrollHeight;
                }
            }, 600); // 600ms delay for visual feedback
        });

        // Controles Mobile Sidebar
        function toggleSidebar() {
            sidebar.classList.toggle('hidden');
            mobileOverlay.classList.toggle('hidden');
        }
        btnToggleSidebar.addEventListener('click', toggleSidebar);
        mobileOverlay.addEventListener('click', toggleSidebar);

        // Inicialização
        window.addEventListener('DOMContentLoaded', () => {
            initNav();
            loadAlgorithm('primo'); // Inicia com o primeiro algoritmo selecionado
        });

    </script>
</body>
</html>
